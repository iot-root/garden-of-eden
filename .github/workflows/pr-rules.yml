name: PR rules

# Enforces the contribution rules in CONTRIBUTORS.md:
#   * the title is a Conventional Commit (release-please builds the changelog from it)
#   * the PR links the issue it resolves, and that issue exists
#   * the branch is named <type>/<short-description>, not after a version or main
#   * the PR is small enough to review; a maintainer can waive this with the
#     `large-pr-approved` label
# Runs on `pull_request` (read-only token), so it is safe for fork PRs.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  pr-rules:
    name: PR rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        env:
          MAX_CHANGED_LINES: "400"
          MAX_CHANGED_FILES: "20"
          SIZE_WAIVER_LABEL: large-pr-approved
        with:
          script: |
            const pr = context.payload.pull_request;
            const TYPES = "feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert";
            const failures = [];
            const notes = [];

            // release-please opens its own release PRs; they follow its format.
            const branch = pr.head.ref;
            const isReleasePR = branch.startsWith("release-please--");
            const isBot = pr.user.type === "Bot";
            if (isReleasePR || isBot) {
              core.info(`Skipping rules for automated PR from ${pr.user.login} (${branch}).`);
              return;
            }

            // 1. Title: Conventional Commit, short enough to read in a changelog.
            const title = pr.title.trim();
            const titleRe = new RegExp(`^(${TYPES})(\\([a-z0-9._/,-]+\\))?!?: \\S.*$`);
            if (!titleRe.test(title)) {
              failures.push(
                `**Title** must be a Conventional Commit: \`<type>(<scope>): <description>\` ` +
                `where type is one of \`${TYPES.replace(/\|/g, ", ")}\`. Got: \`${title}\``
              );
            } else if (title.length > 72) {
              failures.push(`**Title** is ${title.length} characters; keep it to 72 or fewer.`);
            }

            // 2. Linked issue: the body must close or reference an issue in this repo.
            const body = pr.body || "";
            const refRe = /\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?|refs?)\s*:?\s+#(\d+)/gi;
            const refs = [...new Set([...body.matchAll(refRe)].map((m) => Number(m[1])))];
            if (refs.length === 0) {
              failures.push(
                "**Linked issue** missing. Every PR resolves an issue that describes the problem " +
                "and how to reproduce it. Add `Closes #<issue>` to the description " +
                "(or `Refs #<issue>` for partial work)."
              );
            } else {
              for (const n of refs) {
                try {
                  const { data } = await github.rest.issues.get({ ...context.repo, issue_number: n });
                  if (data.pull_request) {
                    failures.push(`**Linked issue** #${n} is a pull request, not an issue. ` +
                      "To stack PRs, write `Depends on #" + n + "` and link the issue separately.");
                  } else {
                    notes.push(`Linked issue #${n}: ${data.title} (${data.state})`);
                  }
                } catch (e) {
                  failures.push(`**Linked issue** #${n} does not exist in ${context.repo.owner}/${context.repo.repo}.`);
                }
              }
            }

            // 3. Branch name: <type>/<short-kebab-description>.
            const branchRe = new RegExp(`^(${TYPES})/[a-z0-9][a-z0-9._-]*$`);
            if (["main", "master"].includes(branch)) {
              failures.push(
                `**Branch** is \`${branch}\`. Open PRs from a topic branch ` +
                "(e.g. `fix/pump-speed-when-off`) so your fork's main stays in sync with upstream."
              );
            } else if (!branchRe.test(branch)) {
              failures.push(
                `**Branch** \`${branch}\` should be \`<type>/<short-description>\` in lowercase ` +
                "kebab-case, e.g. `fix/pump-speed-when-off` or `feat/water-sampler`."
              );
            } else if (/\d+\.\d+/.test(branch)) {
              failures.push(
                `**Branch** \`${branch}\` is named after a version. Name it after the change; ` +
                "release-please decides the version."
              );
            }

            // 4. Size: count code changes; tests and docs don't make a PR harder to review.
            const files = await github.paginate(github.rest.pulls.listFiles, {
              ...context.repo,
              pull_number: pr.number,
              per_page: 100,
            });
            const exempt = (f) =>
              f.startsWith("tests/") || f.startsWith("docs/") || f.endsWith(".md");
            const counted = files.filter((f) => !exempt(f.filename));
            const lines = counted.reduce((n, f) => n + f.additions + f.deletions, 0);
            const maxLines = Number(process.env.MAX_CHANGED_LINES);
            const maxFiles = Number(process.env.MAX_CHANGED_FILES);
            const waiver = process.env.SIZE_WAIVER_LABEL;
            const waived = pr.labels.some((l) => l.name === waiver);
            notes.push(`Size (excluding tests/ and docs): ${lines} changed lines in ${counted.length} files ` +
              `(limit ${maxLines} lines / ${maxFiles} files).`);
            if (lines > maxLines || counted.length > maxFiles) {
              const msg =
                `**Size**: ${lines} changed lines in ${counted.length} files, over the limit of ` +
                `${maxLines} lines / ${maxFiles} files (tests and docs don't count). Split it into ` +
                "smaller PRs, one per issue; stack them with `Depends on #<pr>` if they build on each other.";
              if (waived) {
                notes.push(`Size limit waived by the \`${waiver}\` label.`);
              } else {
                failures.push(msg + ` A maintainer can waive this with the \`${waiver}\` label.`);
              }
            }

            // Report.
            const html = (s) =>
              s.replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/`([^`]+)`/g, "<code>$1</code>");
            const summary = core.summary.addHeading("PR rules", 2);
            if (failures.length) {
              summary.addRaw("These rules come from CONTRIBUTORS.md.\n\n");
              summary.addList(failures.map(html));
            } else {
              summary.addRaw("All PR rules passed.\n\n");
            }
            summary.addList(notes.map(html));
            await summary.write();
            for (const n of notes) core.info(n);
            if (failures.length) {
              for (const f of failures) core.error(f.replace(/\*\*/g, "").replace(/`/g, ""));
              core.setFailed(`${failures.length} PR rule(s) failed. See the job summary.`);
            }
