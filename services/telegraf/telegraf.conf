# Sample Telegraf config for Garden of Eden (issue #16).
#
# Two collection options are shown:
#   1. mqtt_consumer  — subscribe to the gardyn/* topics published by mqtt.py.
#   2. exec           — run the driver CLIs directly (they print line-protocol).
#
# Enable Telegraf in .env (TELEGRAF_ENABLED=true) for documentation purposes;
# Telegraf itself is configured here, not in Python. Point the output at your
# own InfluxDB/Prometheus. Copy to /etc/telegraf/telegraf.d/gardyn.conf.

[agent]
  interval = "60s"
  flush_interval = "60s"

# --- Option 1: consume the MQTT telemetry already published by mqtt.py ---
[[inputs.mqtt_consumer]]
  servers = ["tcp://localhost:1883"]
  topics = [
    "gardyn/temperature",
    "gardyn/humidity",
    "gardyn/pcb/temperature",
    "gardyn/water/level",
  ]
  # username = "gardyn"
  # password = "somepassword"
  data_format = "value"
  data_type = "float"

# --- Option 2: run the driver CLIs (they emit "<measurement>, value=<n>") ---
# [[inputs.exec]]
#   commands = [
#     "/home/gardyn/projects/garden-of-eden/venv/bin/python /home/gardyn/projects/garden-of-eden/app/sensors/temperature/temperature.py",
#     "/home/gardyn/projects/garden-of-eden/venv/bin/python /home/gardyn/projects/garden-of-eden/app/sensors/humidity/humidity.py",
#     "/home/gardyn/projects/garden-of-eden/venv/bin/python /home/gardyn/projects/garden-of-eden/app/sensors/distance/distance.py",
#   ]
#   timeout = "10s"
#   data_format = "influx"

# --- Output: replace with your own backend ---
[[outputs.influxdb_v2]]
  urls = ["http://localhost:8086"]
  token = "$INFLUX_TOKEN"
  organization = "garden"
  bucket = "gardyn"
